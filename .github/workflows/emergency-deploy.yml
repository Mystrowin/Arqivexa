name: Emergency deploy Arqivexa website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Arqivexa website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy Arqivexa website
        id: deployment
        uses: actions/deploy-pages@v4
