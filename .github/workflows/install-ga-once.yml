name: Install Google Analytics once

on:
  push:
    paths:
      - 'scripts/install_ga.py'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GA tag on all real HTML pages
        run: python scripts/install_ga.py
      - name: Commit analytics tag
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          git commit -m "Install Google Analytics across Arqivexa site"
          git push origin HEAD:main
