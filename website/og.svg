  <g transform="translate(350 123)">
    <path d="M5 14h47l11 12h55v123H5z" fill="#111722" stroke="#58a6ff" stroke-opacity=".75"/>
    <path d="M5 38h113" stroke="#335177"/>
    <text x="16" y="31" font-family="monospace" font-size="8" fill="#bed0e7">EXPLORER</text>
    <rect x="17" y="56" width="84" height="7" rx="3.5" fill="#174d82"/>
