    <rect x="14" y="116" width="56" height="6" rx="3" fill="#174d82"/>
    <text x="14" y="153" font-family="monospace" font-size="9" fill="#edf4ff">LZMA2</text>
  </g>
  <path d="M165 178h58" stroke="url(#wire)" stroke-width="2"/><circle cx="181" cy="178" r="4" fill="#bed0e7"/><circle cx="207" cy="178" r="4" fill="#58a6ff"/>
  <g transform="translate(224 144)">
