<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="title desc">
<title id="title">Arqivexa projected archive workspace</title>
<desc id="desc">A compressed CFS archive connects through Windows Projected File System to a File Explorer workspace, supplying file data on demand.</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1627"/><stop offset="1" stop-color="#0c1119"/></linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#174d82"/><stop offset=".52" stop-color="#58a6ff"/><stop offset="1" stop-color="#174d82"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#58a6ff" stroke-opacity=".09" stroke-width="1"/></pattern>
</defs>
<rect width="680" height="400" fill="#0c1119"/>
<rect width="680" height="400" fill="url(#grid)" opacity=".55"/>
<path d="M0 335H680M342 52V335" stroke="#273244" stroke-width="1"/>
<text x="35" y="38" fill="#9aabc1" font-family="monospace" font-size="10" letter-spacing="2">ARQIVEXA / WORKSPACE MODEL</text>

<g transform="translate(42 105)">
  <rect width="174" height="185" rx="4" fill="url(#card)" stroke="#335177"/>
  <path d="M0 39H174" stroke="#273244"/>
  <circle cx="16" cy="19" r="3" fill="#58a6ff"/>
  <text x="29" y="22" fill="#bed0e7" font-family="monospace" font-size="9" letter-spacing="1.2">ARCHIVE.CFS</text>
  <rect x="18" y="61" width="118" height="7" rx="3.5" fill="#58a6ff" opacity=".88"/>
  <rect x="18" y="80" width="91" height="7" rx="3.5" fill="#174d82"/>
  <rect x="18" y="99" width="108" height="7" rx="3.5" fill="#75d7ff"/>
  <rect x="18" y="118" width="68" height="7" rx="3.5" fill="#174d82"/>
  <text x="18" y="157" fill="#edf4ff" font-family="monospace" font-size="10" font-weight="500">LZMA2</text>
  <text x="18" y="172" fill="#9aabc1" font-family="monospace" font-size="7" letter-spacing=".8">COMPRESSED DATA</text>
</g>

<g>
  <path d="M216 197H273" fill="none" stroke="url(#wire)" stroke-width="2"/>
  <circle cx="231" cy="197" r="4" fill="#bed0e7"/>
  <circle cx="257" cy="197" r="4" fill="#58a6ff"/>
  <path d="m269 192 8 5-8 5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
</g>

<g transform="translate(278 158)">
  <rect width="120" height="78" rx="4" fill="#0b1627" stroke="#58a6ff" stroke-opacity=".8"/>
  <text x="60" y="29" fill="#58a6ff" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="1">WINDOWS</text>
  <text x="60" y="48" fill="#edf4ff" text-anchor="middle" font-family="monospace" font-size="12" font-weight="500">ProjFS</text>
  <text x="60" y="64" fill="#9aabc1" text-anchor="middle" font-family="monospace" font-size="7" letter-spacing=".8">ON-DEMAND</text>
</g>

<g>
  <path d="M398 197H455" fill="none" stroke="url(#wire)" stroke-width="2"/>
  <circle cx="413" cy="197" r="4" fill="#bed0e7"/>
  <circle cx="439" cy="197" r="4" fill="#58a6ff"/>
  <path d="m451 192 8 5-8 5" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
</g>

<g transform="translate(462 125)">
  <path d="M7 16h52l13 13h96v126H7z" fill="url(#card)" stroke="#58a6ff" stroke-opacity=".78" stroke-width="1.2"/>
  <path d="M7 43h161" stroke="#335177"/>
  <text x="22" y="35" fill="#bed0e7" font-family="monospace" font-size="9" letter-spacing="1">EXPLORER</text>
  <rect x="24" y="64" width="117" height="8" rx="4" fill="#174d82" opacity=".8"/>
  <rect x="24" y="85" width="94" height="8" rx="4" fill="#174d82" opacity=".65"/>
  <rect x="24" y="106" width="106" height="8" rx="4" fill="#174d82" opacity=".5"/>
  <text x="24" y="139" fill="#58a6ff" font-family="monospace" font-size="8" letter-spacing="1">PROJECTED FILES</text>
</g>

<text x="42" y="365" fill="#9aabc1" font-family="monospace" font-size="8" letter-spacing="1.2">CFS ARCHIVE</text>
<text x="282" y="365" fill="#58a6ff" font-family="monospace" font-size="8" letter-spacing="1.2">PROJECT + HYDRATE</text>
<text x="510" y="365" fill="#9aabc1" font-family="monospace" font-size="8" letter-spacing="1.2">FILE EXPLORER</text>
</svg>
